name: Tests

on:
  push:
    branches:
      - main
      - master
      - branch-2.*
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sundays at 02:00

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set Up Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
          key: php-cs-fixer-${{ hashFiles('composer.lock') }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - name: Validate composer.json and composer.lock
        run: composer validate
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress
      - name: Format
        run: composer format-ci

  static:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set Up Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
          key: phpstan-${{ hashFiles('composer.lock') }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress
      - name: PHPStan
        run: composer analyse-ci

  test:
    name: PHP ${{ matrix.php }} / DB ${{ matrix.database }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        database: ["pgsql"]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set Up Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
          key: vendor-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: mbstring
          ini-file: development
      - name: Set up database
        run: ./.github/setup-db.sh "${{ matrix.database }}"
      - name: Check versions
        run: php -v && composer -V
      - name: Validate composer.json and composer.lock
        run: composer validate
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version || magick -version
      - name: Install PHP dependencies
        run: composer install --no-progress
      - name: Run test suite
        run: composer test
